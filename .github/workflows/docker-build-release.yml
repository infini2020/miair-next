name: Build / Publish Docker Image (GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 / 版本号 (如 latest, 0.7.0)'
        required: true
        default: 'latest'
        type: string
      tag_as_latest:
        description: '是否同时标记为 latest 标签'
        required: false
        default: true
        type: boolean
      platforms:
        description: '构建目标平台架构'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
      push:
        description: '是否发布到 GitHub 镜像仓库 (GHCR)'
        required: false
        default: true
        type: boolean
      skip_tests:
        description: '是否跳过前置测试 (pytest/ruff/build)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend lint (ruff)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .

      - name: Backend tests (pytest)
        working-directory: backend
        run: python -m pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck & build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  build:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_as_latest && (inputs.tag != 'latest') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.push) || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build / push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ (github.event_name == 'workflow_dispatch' && inputs.push) || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "### 🐳 Docker 镜像构建完成"
            echo ""
            echo "- **触发方式**: \`${{ github.event_name }}\`"
            echo "- **代码提交**: \`${{ github.sha }}\`"
            echo "- **目标架构**: \`${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}\`"
            if [ "${{ (github.event_name == 'workflow_dispatch' && inputs.push) || startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "- **已发布到 GitHub 仓库 (GHCR)**:"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
              echo "- **拉取命令示例**:"
              echo '```bash'
              FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
              echo "docker pull $FIRST_TAG"
              echo '```'
            else
              echo "- **未推送到镜像仓库**（测试/本地构建模式）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Docker 镜像已发布到 GitHub Container Registry（标签为版本号）：

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
