[project]
name = "miair-next"
version = "0.11.1"
description = "Make Xiaomi AI speakers act as DLNA / AirPlay renderers, with a modern admin panel"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "aiohttp>=3.9.0",
    "miservice-fork~=2.9.3",
    "zeroconf>=0.38.0",
    "pycryptodome>=3.15.0",
    "av>=10.0.0",
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # 进程级超时兜底: 守护线程到点 dump 栈并硬杀, 不依赖 asyncio 取消机制
    # (3.10/3.11 的 wait_for 可能吞掉 CancelledError, 见 tests/test_poll_concurrency.py)
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "watchfiles>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# 任何单测卡死都应在 120s 内被守护线程杀掉并留下栈, 而不是让 CI 白等到 job 超时。
# 用 thread 而非 signal: 不依赖事件循环的取消机制, 对 3.10/3.11 的 wait_for 缺陷免疫。
addopts = "--timeout=120 --timeout-method=thread"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式指定规则集, 不依赖 ruff 默认值 (跨版本确定性);
# 不启用 B008 (FastAPI 的 Depends() 默认参数为框架惯用法)
select = ["E4", "E7", "E9", "F", "W", "I"]

# app/engine 是移植的协议层, 不纳入格式与风格类规则 (见 per-file-ignores);
# 但"真实缺陷"类规则必须覆盖 —— 历史上 `Config` / `Callable` 未定义、
# `path` 被同名参数遮盖, 正是靠 E9/F 这一层才暴露出来。

[tool.ruff.lint.per-file-ignores]
# 引擎层只豁免风格与"疑似残留"类规则 (移植代码强行重排会淹没真实 diff):
#   E4/E7/W/I —— 空行空白、单行多语句、import 排序, 纯风格
#   F841      —— 占位变量 (`keymsg = None`)、跨行拆分遗留的未使用中间量,
#                属"可能残留"而非确定缺陷, 清理风险高于收益
# 保留生效的: E9 (语法错误) / F401 (未使用导入) / F541 / F811 (重定义) /
#             F821 (未定义名) —— 这几类都是确定性问题
"app/engine/**/*.py" = ["E4", "E7", "W", "I", "F841"]
